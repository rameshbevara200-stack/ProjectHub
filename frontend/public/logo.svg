<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Outer Frame: Precision Architectural Rhombus / Diamond Shield -->
  <rect x="10" y="10" width="100" height="100" rx="4" fill="#141719" />
  
  <!-- Subtle Internal Coordinate Grid Lines -->
  <line x1="60" y1="18" x2="60" y2="102" stroke="#2C3238" stroke-width="1.5" stroke-dasharray="3 3" />
  <line x1="18" y1="60" x2="102" y2="60" stroke="#2C3238" stroke-width="1.5" stroke-dasharray="3 3" />
  <circle cx="60" cy="60" r="42" stroke="#2C3238" stroke-width="1.5" />
  
  <!-- Compass / Meridian Navigation Needle (Maritime North Anchor) in Maritime Safety Rust -->
  <polygon points="60,22 69,56 60,60" fill="#C85A32" />
  <polygon points="60,22 51,56 60,60" fill="#E06D44" />
  
  <!-- South Needle in Cold Slate / Off-White -->
  <polygon points="60,98 69,64 60,60" fill="#9AA1A9" />
  <polygon points="60,98 51,64 60,60" fill="#EFECE6" />
  
  <!-- East / West Precision Accents -->
  <polygon points="98,60 64,55 60,60" fill="#697077" />
  <polygon points="22,60 56,65 60,60" fill="#697077" />
  
  <!-- Central Hub Core -->
  <circle cx="60" cy="60" r="6" fill="#141719" stroke="#EFECE6" stroke-width="2" />
  <circle cx="60" cy="60" r="2" fill="#C85A32" />
</svg>

